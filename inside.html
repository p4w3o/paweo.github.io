<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="/css/style.css" />
        <link rel="stylesheet" href="/css/floorplan.css" />
        <link rel="icon" href="static/icons/favicon.ico" type="image/x-icon" />

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>paweo</title>

        <style>
            body {
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                font-family: sans-serif;
                background-color: #333;
                color: #222;
                opacity: 0;
                animation: fadeIn 5s ease-out forwards;
            }

            h1 {
                margin: 20px 0;
                text-align: center;
            }

            img {
                max-width: 90%;
                height: auto;
            }

            .logo {
                margin-top: 150px;

                width: 250px;
                max-width: 60%;

                image-rendering: pixelated;
                image-rendering: crisp-edges;
            }

            .content {
                flex: 1;
                text-align: center;
                padding: 20px;
            }

            footer {
                margin-top: 40px;
                margin-bottom: 10px;
                font-size: 0.9em;
                color: #999;
            }
        </style>
    </head>
    <body>
        <!-- HEAD -->
        <div id="floorplan-container"></div>
        <script src="/js/floorplan.js"></script>

        <script>
            const breath = new Audio("/sounds/breath.wav");
            breath.loop = true;
            breath.volume = 0.5; // optional, adjust volume

            // Try to autoplay immediately
            breath.play().catch(() => {
                // If autoplay is blocked, wait for first user interaction
                const startAudio = () => {
                    breath.play();
                    document.removeEventListener("click", startAudio);
                    document.removeEventListener("keydown", startAudio);
                };

                document.addEventListener("click", startAudio);
                document.addEventListener("keydown", startAudio);
            });
        </script>

        <!-- Footer -->
        <footer>
            <a
                href="/paweodoor.html"
                id="presence"
                style="display: block; text-decoration: none; color: inherit"
            >
                paweo n'est pas là...
            </a>
        </footer>

        <script>
            fetch("https://ishome.paweo.cc")
                .then((res) => res.json())
                .then((data) => {
                    const link = document.getElementById("presence");

                    if (data.is_home) {
                        link.textContent = "";
                        link.removeAttribute("href");
                    } else {
                        link.textContent = "paweo n'est pas là...";
                    }
                })
                .catch(() => {
                    document.getElementById("presence").textContent = "";
                    link.removeAttribute("href");
                });
        </script>
    </body>
</html>
